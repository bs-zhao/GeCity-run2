name: Verify self-hosted experiment in Chrome
on:
  push:
    paths:
      - .github/workflows/browser-smoke.yml
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP check of all locally hosted dependencies
        shell: bash
        run: |
          set -euo pipefail
          base="https://bs-zhao.github.io/GeCity-run2"
          for path in / /vendor/jspsych-7.3.4.min.js /vendor/jspsych-7.3.4.css /vendor/plugin-html-keyboard-response-1.1.3.min.js /data/experiment_data.js /plugin/city_search.js; do
            url="$base$path"
            curl --retry 3 --retry-delay 2 -fLsS --max-time 15 -o /tmp/http-payload -w 'HTTP=%{http_code} BYTES=%{size_download} URL=%{url_effective}\n' "$url"
            test -s /tmp/http-payload
          done
      - name: Headless Chrome opens one-trial jsPsych experiment
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 \
            --dump-dom 'https://bs-zhao.github.io/GeCity-run2/?short=1&table=1&feedback=0&dots=1&reward=10&cost=1&free=1' \
            > /tmp/experiment-dom.html 2> /tmp/chrome-stderr.log || {
              cat /tmp/chrome-stderr.log
              exit 1
            }
          grep -q 'Welcome' /tmp/experiment-dom.html || {
            echo 'ERROR: Welcome screen not present.'
            tail -c 2500 /tmp/experiment-dom.html || true
            tail -c 1500 /tmp/chrome-stderr.log || true
            exit 1
          }
          echo "PASS: Welcome screen rendered inside Chrome"

name: Vendor jsPsych dependencies once
on:
  push:
    paths:
      - .github/workflows/vendor-jspsych.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official jsPsych 7 browser bundles from npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor /tmp/gecity-core /tmp/gecity-keyboard
          npm pack --silent --pack-destination /tmp jspsych@7.3.4
          npm pack --silent --pack-destination /tmp @jspsych/plugin-html-keyboard-response@1.1.3
          tar -xzf /tmp/jspsych-7.3.4.tgz -C /tmp/gecity-core
          tar -xzf /tmp/jspsych-plugin-html-keyboard-response-1.1.3.tgz -C /tmp/gecity-keyboard
          cp /tmp/gecity-core/package/dist/index.browser.min.js vendor/jspsych-7.3.4.min.js
          cp /tmp/gecity-core/package/css/jspsych.css vendor/jspsych-7.3.4.css
          cp /tmp/gecity-keyboard/package/dist/index.browser.min.js vendor/plugin-html-keyboard-response-1.1.3.min.js
          for file in vendor/*; do test -s "$file" || exit 1; done
          ls -lh vendor/
          cat > vendor/THIRD_PARTY_LICENSES.md <<'EOF'
          Local browser bundles are copied unchanged from npm distributions:
          - jspsych@7.3.4 (MIT) — https://www.npmjs.com/package/jspsych
          - @jspsych/plugin-html-keyboard-response@1.1.3 (MIT) — https://www.npmjs.com/package/@jspsych/plugin-html-keyboard-response

          Copyright belongs to the original jsPsych authors and contributors; see https://github.com/jspsych/jsPsych/blob/main/LICENSE.md
          EOF
      - name: Commit version-pinned browser assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --cached --quiet; then
            echo "No vendor changes needed"
          else
            git commit -m "Vendor jsPsych core and keyboard plugin locally to avoid unreachable remote host"
            git push
          fi
